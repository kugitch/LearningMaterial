<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>單點 2D 幾何變換探索與測驗</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --ink: #17202a;
      --muted: #5d6d7e;
      --grid: rgba(52, 73, 94, 0.14);
      --axis: #273746;
      --red: #e74c3c;
      --orange: #f39c12;
      --green: #27ae60;
      --blue: #2980b9;
      --panel: rgba(255, 255, 255, 0.74);
      --shadow: 0 12px 35px rgba(31, 45, 61, 0.18);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at top, #ffffff 0, var(--bg) 48%, #eaf0f8 100%);
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    button, input { font-family: inherit; }
    button { cursor: pointer; border: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(14px);
      box-shadow: 0 2px 16px rgba(44, 62, 80, 0.12);
    }

    .nav-btn {
      padding: 11px 18px;
      border-radius: 999px;
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 16px rgba(0,0,0,0.12);
      transform: translateY(0);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      white-space: nowrap;
    }
    .nav-btn:hover { transform: translateY(-1px); filter: brightness(1.04); }
    .nav-btn.active { outline: 3px solid rgba(23, 32, 42, 0.18); box-shadow: 0 10px 22px rgba(0,0,0,0.2); }
    .nav-main { background: #7f8c8d; }
    .nav-eureka { background: #e74c3c; }
    .nav-quiz { background: #f39c12; }

    .view { display: none; }
    .view.active { display: block; }

    #mainView {
      position: relative;
      height: calc(100dvh - 66px);
      min-height: 560px;
      overflow: hidden;
    }

    .canvas-stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 10px;
    }

    #geoCanvas {
      width: min(100vw, calc(100dvh - 86px));
      height: min(100vw, calc(100dvh - 86px));
      max-width: 940px;
      max-height: 940px;
      aspect-ratio: 1 / 1;
      background: #fff;
      border-radius: 24px;
      box-shadow: inset 0 0 0 1px rgba(39, 55, 70, 0.12), 0 18px 55px rgba(31, 45, 61, 0.18);
      cursor: grab;
      touch-action: none;
    }
    #geoCanvas.grabbing { cursor: grabbing; }
    #geoCanvas.locked { cursor: wait; }

    .floating-panel {
      position: absolute;
      z-index: 20;
      width: 322px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.72);
      border-radius: var(--radius);
      background: var(--panel);
      backdrop-filter: blur(16px) saturate(1.25);
      box-shadow: var(--shadow);
      touch-action: none;
    }
    .panel-a { left: 18px; top: 18px; }
    .panel-b { right: 18px; top: 18px; width: 362px; }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: -3px -3px 10px;
      padding: 8px 10px;
      border-radius: 14px;
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      background: linear-gradient(135deg, rgba(44,62,80,0.94), rgba(52,152,219,0.88));
      cursor: move;
    }
    .panel-title small { font-size: 11px; opacity: 0.82; font-weight: 700; }

    .formula-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      font-size: 19px;
      font-weight: 900;
      white-space: nowrap;
    }
    .formula-row input {
      width: 74px;
      height: 38px;
      border: 2px solid rgba(41, 128, 185, 0.28);
      border-radius: 10px;
      text-align: center;
      font-size: 18px;
      font-weight: 900;
      color: var(--ink);
      background: rgba(255,255,255,0.92);
      outline: none;
    }
    .formula-row input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(41,128,185,0.12); }

    .button-row { display: flex; gap: 7px; flex-wrap: wrap; }
    .action-btn, .big-btn, .choice-btn, .mini-btn {
      border-radius: 12px;
      color: #fff;
      font-weight: 900;
      box-shadow: 0 6px 14px rgba(0,0,0,0.12);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .action-btn:hover, .big-btn:hover, .choice-btn:hover, .mini-btn:hover { transform: translateY(-1px); filter: brightness(1.04); }
    .action-btn { flex: 1; min-width: 86px; padding: 10px 8px; font-size: 14px; }
    .green { background: var(--green); }
    .orange { background: var(--orange); }
    .blue { background: var(--blue); }
    .gray { background: #7f8c8d; }
    .red { background: var(--red); }

    .feedback {
      min-height: 27px;
      margin-top: 8px;
      padding: 6px 8px;
      border-radius: 10px;
      color: var(--muted);
      font-weight: 800;
      background: rgba(255,255,255,0.55);
    }
    .feedback.ok { color: #1e8449; background: rgba(39,174,96,0.13); }
    .feedback.bad { color: #b03a2e; background: rgba(231,76,60,0.12); }

    .control-section {
      padding: 9px;
      margin: 8px 0;
      border-radius: 14px;
      background: rgba(255,255,255,0.56);
      border: 1px solid rgba(39,55,70,0.08);
    }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; font-weight: 900; }
    .section-head label { display: inline-flex; align-items: center; gap: 6px; }
    input[type="checkbox"], input[type="radio"] { accent-color: var(--blue); }

    .dir-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; align-items: center; }
    .rot-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 6px; }
    .reflect-row, .spin-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .axis-label { grid-column: 1 / -1; color: var(--muted); font-weight: 900; font-size: 12px; margin-top: 2px; }
    .mini-btn {
      padding: 7px 4px;
      font-size: 12px;
      color: var(--ink);
      background: #eef4fb;
      box-shadow: none;
      border: 1px solid rgba(39,55,70,0.12);
      white-space: nowrap;
    }
    .mini-btn.active { color: #fff; background: var(--blue); border-color: var(--blue); }

    .big-actions { display: grid; gap: 8px; margin-top: 10px; }
    .big-btn { padding: 11px 10px; font-size: 15px; }

    .content-view {
      width: min(1040px, calc(100% - 28px));
      margin: 22px auto 48px;
      padding: 22px;
      border-radius: 24px;
      background: rgba(255,255,255,0.84);
      box-shadow: var(--shadow);
    }
    .content-view h1 { margin: 0 0 8px; font-size: clamp(25px, 4vw, 42px); }
    .content-view p.lead { margin: 0 0 20px; color: var(--muted); font-weight: 700; }

    .question-list { display: grid; gap: 14px; }
    .question-card {
      padding: 16px;
      border-radius: 18px;
      border: 1px solid rgba(39,55,70,0.1);
      background: #fff;
      box-shadow: 0 8px 22px rgba(31,45,61,0.08);
    }
    .question-card h3 { margin: 0 0 10px; font-size: 17px; }
    .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 9px; }
    .choice-btn { padding: 10px; color: var(--ink); background: #eef4fb; box-shadow: none; border: 1px solid rgba(39,55,70,0.1); text-align: left; }
    .choice-btn.correct { color: #fff; background: var(--green); }
    .choice-btn.wrong { color: #fff; background: var(--red); }
    .practice-bar { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 0; }
    .practice-bar button { padding: 11px 14px; border-radius: 999px; color: #fff; font-weight: 900; }

    @media (max-width: 600px) {
      .app-header { gap: 4px; padding: 6px 4px; }
      .nav-btn { padding: 7px 7px; font-size: 12px; }
      #mainView { height: calc(100dvh - 43px); min-height: 520px; }
      .canvas-stage { align-items: start; padding-top: 4px; }
      #geoCanvas { width: min(100vw, calc(100dvh - 270px)); height: min(100vw, calc(100dvh - 270px)); border-radius: 14px; }
      .floating-panel {
        position: fixed;
        width: auto;
        padding: 7px;
        border-radius: 12px;
        touch-action: manipulation;
      }
      .panel-a { left: 4px !important; right: 4px !important; top: auto !important; bottom: 144px !important; }
      .panel-b { left: 4px !important; right: 4px !important; top: auto !important; bottom: 4px !important; max-height: 136px; overflow: auto; }
      .panel-title { margin-bottom: 4px; padding: 4px 6px; font-size: 9px; cursor: default; }
      .panel-title small { display: none; }
      .formula-row { gap: 4px; margin-bottom: 5px; font-size: 12px; }
      .formula-row input { width: 54px; height: 30px; font-size: 16px !important; border-radius: 8px; }
      .button-row { gap: 4px; }
      .action-btn { min-width: 0; padding: 6px 4px; font-size: 10px; border-radius: 8px; }
      .feedback { min-height: 19px; margin-top: 4px; padding: 3px 5px; font-size: 10px; }
      .control-section { padding: 5px; margin: 4px 0; border-radius: 9px; }
      .section-head { margin-bottom: 3px; font-size: 10px; }
      .axis-label { font-size: 8px; }
      .dir-grid { grid-template-columns: repeat(7, minmax(32px, 1fr)); gap: 2px; }
      .rot-grid { gap: 2px; }
      .mini-btn { padding: 4px 2px; font-size: 9px; border-radius: 7px; white-space: nowrap; }
      .reflect-row, .spin-row { gap: 5px; font-size: 10px; }
      .big-actions { grid-template-columns: repeat(3, 1fr); gap: 3px; margin-top: 4px; }
      .big-btn { padding: 6px 3px; font-size: 9px; border-radius: 8px; }
      .content-view { width: calc(100% - 14px); margin-top: 10px; padding: 13px; }
      .choices { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <button class="nav-btn nav-main active" data-view="mainView">🏠 探索圖形</button>
    <button class="nav-btn nav-eureka" data-view="eurekaView">💡 Eureka!</button>
    <button class="nav-btn nav-quiz" data-view="quizView">🔥 考考你</button>
  </header>

  <main id="mainView" class="view active">
    <div class="canvas-stage"><canvas id="geoCanvas" aria-label="2D geometry transformation canvas"></canvas></div>

    <section class="floating-panel panel-a" id="predictPanel">
      <div class="panel-title">🧠 測驗與預測 <small>桌面可拖曳</small></div>
      <div class="formula-row" aria-label="prediction inputs">
        <span id="predictLabel">P' = (</span>
        <input id="guessX" type="number" inputmode="numeric" aria-label="x coordinate prediction" />
        <span>,</span>
        <input id="guessY" type="number" inputmode="numeric" aria-label="y coordinate prediction" />
        <span>)</span>
      </div>
      <div class="button-row">
        <button id="checkBtn" class="action-btn green">✅ 檢查</button>
        <button id="answerBtn" class="action-btn orange">👁️ 解答</button>
        <button id="slowBtnA" class="action-btn blue">▶️ 慢動作</button>
      </div>
      <div id="predictFeedback" class="feedback">拖曳點 P，或先設定變換再預測 P'。</div>
    </section>

    <section class="floating-panel panel-b" id="controlPanel">
      <div class="panel-title">⚙️ 控制選項 <small>拖邊緣移動</small></div>

      <div class="control-section">
        <div class="section-head"><label><input id="enableTranslate" type="checkbox" checked /> 平移</label><span id="translateReadout">(0, 0)</span></div>
        <div class="dir-grid" id="translateButtons"></div>
      </div>

      <div class="control-section">
        <div class="section-head"><label><input id="enableRotate" type="checkbox" /> 旋轉</label><span id="rotateReadout">0°</span></div>
        <div class="spin-row">
          <label><input name="spin" value="ccw" type="radio" checked /> 逆時針</label>
          <label><input name="spin" value="cw" type="radio" /> 順時針</label>
        </div>
        <div class="rot-grid" id="rotationButtons"></div>
      </div>

      <div class="control-section">
        <div class="section-head"><label><input id="enableReflect" type="checkbox" /> 反射</label><span id="reflectReadout">無</span></div>
        <div class="reflect-row">
          <label><input id="reflectX" type="checkbox" /> 沿 x 軸</label>
          <label><input id="reflectY" type="checkbox" /> 沿 y 軸</label>
        </div>
      </div>

      <div class="big-actions">
        <button id="slowBtnB" class="big-btn blue">▶️ 睇變動</button>
        <button id="applyBtn" class="big-btn green">📌 套用變換為新起點</button>
        <button id="resetBtn" class="big-btn gray">🔄 重置</button>
      </div>
    </section>
  </main>

  <section id="eurekaView" class="view content-view">
    <h1>💡 Eureka! 核心規則</h1>
    <p class="lead">答錯時不會直接爆雷；再想一下規則，答對才會亮綠燈。</p>
    <div id="eurekaQuestions" class="question-list"></div>
  </section>

  <section id="quizView" class="view content-view">
    <h1>🔥 考考你：實戰測驗</h1>
    <p class="lead">題目會隨機生成，座標包含大量負整數，請先心算再選答案。</p>
    <div id="quizQuestions" class="question-list"></div>
    <div class="practice-bar">
      <button class="green" data-practice="reflection">➕ 2 題反射</button>
      <button class="blue" data-practice="rotation">➕ 2 題旋轉</button>
      <button class="orange" data-practice="translation">➕ 2 題平移</button>
    </div>
  </section>

  <script>
    const canvas = document.getElementById('geoCanvas');
    const ctx = canvas.getContext('2d');
    const state = {
      point: { x: 3, y: 2 },
      previous: null,
      index: 0,
      zoom: 1,
      draggingPoint: false,
      animating: false,
      animation: null,
      transform: { translate: true, dx: 0, dy: 0, rotate: false, angle: 0, spin: 'ccw', reflect: false, rx: false, ry: false }
    };

    const $ = (id) => document.getElementById(id);
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const clean = (n) => Object.is(n, -0) ? 0 : Math.round(n * 100) / 100;
    const coordText = (p) => `(${clean(p.x)}, ${clean(p.y)})`;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function metrics() {
      const rect = canvas.getBoundingClientRect();
      const unit = (Math.min(rect.width, rect.height) / 18) * state.zoom;
      return { rect, unit, cx: rect.width / 2, cy: rect.height / 2 };
    }

    function toScreen(p) {
      const m = metrics();
      return { x: m.cx + p.x * m.unit, y: m.cy - p.y * m.unit };
    }

    function toWorld(clientX, clientY) {
      const m = metrics();
      const x = (clientX - m.rect.left - m.cx) / m.unit;
      const y = -(clientY - m.rect.top - m.cy) / m.unit;
      return { x, y };
    }

    function applyTransformToPoint(p) {
      let x = p.x, y = p.y;
      if (state.transform.reflect) {
        if (state.transform.rx) y = -y;
        if (state.transform.ry) x = -x;
      }
      if (state.transform.rotate) {
        const signed = state.transform.spin === 'cw' ? -state.transform.angle : state.transform.angle;
        const deg = ((signed % 360) + 360) % 360;
        if (deg === 90) [x, y] = [-y, x];
        if (deg === 180) [x, y] = [-x, -y];
        if (deg === 270) [x, y] = [y, -x];
      }
      if (state.transform.translate) {
        x += state.transform.dx;
        y += state.transform.dy;
      }
      return { x: clean(x), y: clean(y) };
    }

    function transformedPoint() { return applyTransformToPoint(state.point); }

    function drawGrid() {
      const { rect, unit, cx, cy } = metrics();
      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.save();
      ctx.lineWidth = 1;
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid');
      for (let i = -9; i <= 9; i++) {
        const x = cx + i * unit;
        const y = cy - i * unit;
        ctx.beginPath(); ctx.moveTo(x, cy - 9 * unit); ctx.lineTo(x, cy + 9 * unit); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx - 9 * unit, y); ctx.lineTo(cx + 9 * unit, y); ctx.stroke();
      }
      ctx.strokeStyle = '#273746';
      ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(cx - 9.4 * unit, cy); ctx.lineTo(cx + 9.4 * unit, cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, cy - 9.4 * unit); ctx.lineTo(cx, cy + 9.4 * unit); ctx.stroke();
      ctx.fillStyle = '#273746';
      ctx.font = `${Math.max(10, Math.min(14, unit * 0.34))}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const step = unit < 22 ? 3 : unit < 34 ? 2 : 1;
      for (let i = -9; i <= 9; i += step) {
        if (i !== 0) {
          ctx.fillText(i, cx + i * unit, cy + 15);
          ctx.fillText(i, cx - 16, cy - i * unit);
        }
      }
      ctx.fillText('0', cx - 12, cy + 14);
      ctx.fillText('x', cx + 9.25 * unit, cy - 13);
      ctx.fillText('y', cx + 13, cy - 9.25 * unit);
      ctx.restore();
    }

    function drawPoint(p, label, color, showCoords = true, radius = 8) {
      const s = toScreen(p);
      ctx.save();
      ctx.beginPath();
      ctx.arc(s.x, s.y, radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
      ctx.fillStyle = '#17202a';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText(showCoords ? `${label}${coordText(p)}` : label, s.x + 11, s.y - 8);
      ctx.restore();
    }

    function drawOriginLink(p) {
      const a = toScreen({ x: 0, y: 0 });
      const b = toScreen(p);
      ctx.save();
      ctx.setLineDash([9, 7]);
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(23, 32, 42, 0.4)';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.restore();
    }

    function draw() {
      drawGrid();
      const target = state.animation ? state.animation.current : transformedPoint();
      const targetSame = target.x === state.point.x && target.y === state.point.y;
      if (state.animation) {
        drawOriginLink(target);
        drawPoint(state.point, `P${state.index}`, '#34495e', true, 7);
        drawPoint(target, `P'`, '#e74c3c', false, 9);
        return;
      }
      if (targetSame && state.previous) {
        drawOriginLink(state.previous.point);
        drawPoint(state.previous.point, `P${state.previous.index}`, '#95a5a6', true, 7);
      } else if (!targetSame) {
        drawOriginLink(target);
        drawPoint(target, `P${state.index + 1}`, '#e74c3c', true, 8);
      }
      drawOriginLink(state.point);
      drawPoint(state.point, `P${state.index}`, '#2980b9', true, 9);
    }

    function setFeedback(text, type = '') {
      const el = $('predictFeedback');
      el.textContent = text;
      el.className = `feedback ${type}`.trim();
    }

    function updateReadouts() {
      const t = state.transform;
      $('predictLabel').textContent = `P${state.index + 1} = (`;
      $('translateReadout').textContent = `(${t.dx}, ${t.dy})`;
      $('rotateReadout').textContent = `${t.spin === 'cw' ? '順' : '逆'} ${t.angle}°`;
      const parts = [];
      if (t.rx) parts.push('x 軸');
      if (t.ry) parts.push('y 軸');
      $('reflectReadout').textContent = parts.length ? parts.join(' + ') : '無';
      document.querySelectorAll('[data-dx]').forEach(b => b.classList.toggle('active', Number(b.dataset.dx) === t.dx));
      document.querySelectorAll('[data-dy]').forEach(b => b.classList.toggle('active', Number(b.dataset.dy) === t.dy));
      document.querySelectorAll('[data-angle]').forEach(b => b.classList.toggle('active', Number(b.dataset.angle) === t.angle));
      draw();
    }

    function buildTransformButtons() {
      const box = $('translateButtons');
      box.innerHTML = '<div class="axis-label">X 軸方向</div>';
      for (let n = -3; n <= 3; n++) {
        const b = document.createElement('button'); b.className = 'mini-btn'; b.dataset.dx = n;
        b.textContent = n < 0 ? `左${Math.abs(n)}` : n > 0 ? `右${n}` : '0';
        b.onclick = () => { state.transform.dx = n; state.transform.translate = true; $('enableTranslate').checked = true; updateReadouts(); };
        box.appendChild(b);
      }
      box.insertAdjacentHTML('beforeend', '<div class="axis-label">Y 軸方向</div>');
      for (let n = -3; n <= 3; n++) {
        const b = document.createElement('button'); b.className = 'mini-btn'; b.dataset.dy = n;
        b.textContent = n < 0 ? `下${Math.abs(n)}` : n > 0 ? `上${n}` : '0';
        b.onclick = () => { state.transform.dy = n; state.transform.translate = true; $('enableTranslate').checked = true; updateReadouts(); };
        box.appendChild(b);
      }
      const rot = $('rotationButtons');
      [0, 90, 180, 270].forEach(a => {
        const b = document.createElement('button'); b.className = 'mini-btn'; b.dataset.angle = a; b.textContent = `${a}°`;
        b.onclick = () => { state.transform.angle = a; state.transform.rotate = a !== 0; $('enableRotate').checked = a !== 0; updateReadouts(); };
        rot.appendChild(b);
      });
    }

    function resetTransform() {
      Object.assign(state.transform, { translate: true, dx: 0, dy: 0, rotate: false, angle: 0, spin: 'ccw', reflect: false, rx: false, ry: false });
      $('enableTranslate').checked = true; $('enableRotate').checked = false; $('enableReflect').checked = false;
      $('reflectX').checked = false; $('reflectY').checked = false;
      document.querySelector('input[name="spin"][value="ccw"]').checked = true;
      updateReadouts();
    }

    function clearInputs() { $('guessX').value = ''; $('guessY').value = ''; }

    function setControlsDisabled(disabled) {
      document.querySelectorAll('button, input').forEach(el => {
        if (!el.classList.contains('nav-btn')) el.disabled = disabled;
      });
      canvas.classList.toggle('locked', disabled);
    }

    function makeAnimationSegments() {
      const segs = [];
      const t = state.transform;
      let p = { ...state.point };
      if (t.reflect && (t.rx || t.ry)) {
        const next = { x: t.ry ? -p.x : p.x, y: t.rx ? -p.y : p.y };
        segs.push({ from: p, to: next }); p = next;
      }
      if (t.rotate && t.angle !== 0) {
        const old = { ...p };
        const signed = t.spin === 'cw' ? -t.angle : t.angle;
        const deg = ((signed % 360) + 360) % 360;
        if (deg === 90) p = { x: -old.y, y: old.x };
        if (deg === 180) p = { x: -old.x, y: -old.y };
        if (deg === 270) p = { x: old.y, y: -old.x };
        segs.push({ from: old, to: p });
      }
      if (t.translate && (t.dx || t.dy)) {
        const next = { x: p.x + t.dx, y: p.y + t.dy };
        segs.push({ from: p, to: next });
      }
      return segs.length ? segs : [{ from: state.point, to: transformedPoint() }];
    }

    function slowMotion() {
      if (state.animating) return;
      const guessX = $('guessX').value, guessY = $('guessY').value;
      const labelBefore = $('predictLabel').textContent;
      const segments = makeAnimationSegments();
      state.animating = true;
      setControlsDisabled(true);
      $('guessX').value = guessX; $('guessY').value = guessY; $('predictLabel').textContent = labelBefore;
      const startTime = performance.now();
      const duration = 1600;
      function frame(now) {
        const total = segments.length * duration;
        const elapsed = Math.min(now - startTime, total);
        const idx = Math.min(segments.length - 1, Math.floor(elapsed / duration));
        const local = (elapsed - idx * duration) / duration;
        const eased = local < 0.5 ? 2 * local * local : 1 - Math.pow(-2 * local + 2, 2) / 2;
        const seg = segments[idx];
        state.animation = { current: { x: clean(seg.from.x + (seg.to.x - seg.from.x) * eased), y: clean(seg.from.y + (seg.to.y - seg.from.y) * eased) } };
        draw();
        if (elapsed < total) requestAnimationFrame(frame);
        else {
          state.animation = null;
          state.animating = false;
          setControlsDisabled(false);
          draw();
          setFeedback(`慢動作完成，終點是 ${coordText(transformedPoint())}。`, 'ok');
        }
      }
      requestAnimationFrame(frame);
    }

    function applyInstant() {
      if (state.animating) return;
      const next = transformedPoint();
      state.previous = { index: state.index, point: { ...state.point } };
      state.point = next;
      state.index += 1;
      clearInputs();
      resetTransform();
      setFeedback(`已瞬間套用為 P${state.index}${coordText(state.point)}。`, 'ok');
      draw();
    }

    function pointerDown(e) {
      if (state.animating) return;
      const p = e.touches ? e.touches[0] : e;
      const w = toWorld(p.clientX, p.clientY);
      const d = Math.hypot(w.x - state.point.x, w.y - state.point.y);
      if (d < 0.75) { state.draggingPoint = true; canvas.classList.add('grabbing'); e.preventDefault(); }
    }
    function pointerMove(e) {
      if (!state.draggingPoint || state.animating) return;
      const p = e.touches ? e.touches[0] : e;
      const w = toWorld(p.clientX, p.clientY);
      state.point = { x: clamp(Math.round(w.x), -9, 9), y: clamp(Math.round(w.y), -9, 9) };
      draw(); e.preventDefault();
    }
    function pointerUp() { state.draggingPoint = false; canvas.classList.remove('grabbing'); }

    let pinchStart = null;
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        pinchStart = { dist: Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY), zoom: state.zoom };
        e.preventDefault();
      } else pointerDown(e);
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && pinchStart) {
        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        state.zoom = clamp(pinchStart.zoom * dist / pinchStart.dist, 0.65, 2.7); draw(); e.preventDefault();
      } else pointerMove(e);
    }, { passive: false });
    canvas.addEventListener('touchend', (e) => { if (e.touches.length < 2) pinchStart = null; pointerUp(); });
    canvas.addEventListener('mousedown', pointerDown);
    window.addEventListener('mousemove', pointerMove);
    window.addEventListener('mouseup', pointerUp);
    canvas.addEventListener('wheel', (e) => { state.zoom = clamp(state.zoom * (e.deltaY > 0 ? 0.92 : 1.08), 0.65, 2.7); draw(); e.preventDefault(); }, { passive: false });

    function makePanelDraggable(panel) {
      const title = panel.querySelector('.panel-title');
      let active = false, offsetX = 0, offsetY = 0;
      const isMobile = () => matchMedia('(max-width: 600px)').matches;
      title.addEventListener('pointerdown', (e) => {
        if (isMobile()) return;
        active = true; offsetX = e.clientX - panel.offsetLeft; offsetY = e.clientY - panel.offsetTop; panel.setPointerCapture(e.pointerId);
      });
      title.addEventListener('pointermove', (e) => {
        if (!active || isMobile()) return;
        const maxX = window.innerWidth - panel.offsetWidth - 8;
        const maxY = window.innerHeight - panel.offsetHeight - 8;
        panel.style.left = `${clamp(e.clientX - offsetX, 8, maxX)}px`;
        panel.style.top = `${clamp(e.clientY - offsetY, 8, maxY)}px`;
        panel.style.right = 'auto';
      });
      title.addEventListener('pointerup', () => active = false);
    }

    function bindControls() {
      $('checkBtn').onclick = () => {
        const target = transformedPoint();
        const gx = Number($('guessX').value), gy = Number($('guessY').value);
        if (Number.isFinite(gx) && Number.isFinite(gy) && gx === target.x && gy === target.y) setFeedback('✅ 太棒了，預測正確！', 'ok');
        else setFeedback('❌ 不太對喔，再想一下試試看！', 'bad');
      };
      $('answerBtn').onclick = () => { const p = transformedPoint(); $('guessX').value = p.x; $('guessY').value = p.y; setFeedback(`答案是 ${coordText(p)}。`, 'ok'); };
      $('slowBtnA').onclick = slowMotion; $('slowBtnB').onclick = slowMotion;
      $('applyBtn').onclick = applyInstant;
      $('resetBtn').onclick = () => { state.point = { x: 3, y: 2 }; state.previous = null; state.index = 0; state.zoom = 1; clearInputs(); resetTransform(); setFeedback('已重置。'); };
      ['enableTranslate','enableRotate','enableReflect','reflectX','reflectY'].forEach(id => $(id).addEventListener('change', () => {
        state.transform.translate = $('enableTranslate').checked;
        state.transform.rotate = $('enableRotate').checked && state.transform.angle !== 0;
        state.transform.reflect = $('enableReflect').checked;
        state.transform.rx = $('reflectX').checked;
        state.transform.ry = $('reflectY').checked;
        if (state.transform.rx || state.transform.ry) { state.transform.reflect = true; $('enableReflect').checked = true; }
        updateReadouts();
      }));
      document.querySelectorAll('input[name="spin"]').forEach(r => r.addEventListener('change', () => { state.transform.spin = r.value; updateReadouts(); }));
      document.querySelectorAll('input[type="number"]').forEach(input => input.addEventListener('blur', () => setTimeout(() => window.scrollTo(0, 0), 0)));
    }

    function qCard(q, idx) {
      const card = document.createElement('article'); card.className = 'question-card';
      card.innerHTML = `<h3>${idx + 1}. ${q.prompt}</h3><div class="choices"></div><div class="feedback">請選一個答案。</div>`;
      const choices = card.querySelector('.choices'); const fb = card.querySelector('.feedback');
      q.choices.forEach(c => {
        const b = document.createElement('button'); b.className = 'choice-btn'; b.textContent = c;
        b.onclick = () => {
          if (c === q.answer) { b.classList.add('correct'); fb.textContent = '✅ 答對了！這就是關鍵規則。'; fb.className = 'feedback ok'; }
          else { b.classList.add('wrong'); setTimeout(() => b.classList.remove('wrong'), 500); fb.textContent = '❌ 不太對喔，再想一下試試看！'; fb.className = 'feedback bad'; }
        };
        choices.appendChild(b);
      });
      return card;
    }

    const fmt = (p) => `(${p.x}, ${p.y})`;
    const shuffle = (arr) => arr.map(v => [Math.random(), v]).sort((a,b) => a[0]-b[0]).map(v => v[1]);
    const uniqueChoices = (answer, extras) => shuffle([...new Set([answer, ...extras])]).slice(0, 4);

    const eureka = [
      { prompt: '點 (x, y) 沿 x 軸反射後會變成？', answer: '(x, -y)', choices: ['(x, -y)', '(-x, y)', '(y, x)', '(-y, -x)'] },
      { prompt: '點 (x, y) 沿 y 軸反射後會變成？', answer: '(-x, y)', choices: ['(-x, y)', '(x, -y)', '(y, -x)', '(-x, -y)'] },
      { prompt: '點 (x, y) 繞原點逆時針 90° 後會變成？', answer: '(-y, x)', choices: ['(-y, x)', '(y, -x)', '(-x, -y)', '(y, x)'] },
      { prompt: '點 (x, y) 繞原點順時針 90° 後會變成？', answer: '(y, -x)', choices: ['(y, -x)', '(-y, x)', '(-x, y)', '(x, -y)'] },
      { prompt: '點 (x, y) 繞原點 180° 後會變成？', answer: '(-x, -y)', choices: ['(-x, -y)', '(x, -y)', '(-x, y)', '(y, x)'] },
      { prompt: '平移向右 a、向上 b，點 (x, y) 會變成？', answer: '(x + a, y + b)', choices: ['(x + a, y + b)', '(x - a, y + b)', '(x + b, y + a)', '(ax, by)'] },
      { prompt: '若同時有反射、旋轉、平移，本頁慢動作演示的順序是？', answer: '反射 → 旋轉 → 平移', choices: ['反射 → 旋轉 → 平移', '平移 → 旋轉 → 反射', '旋轉 → 平移 → 反射', '平移 → 反射 → 旋轉'] },
      { prompt: '點與原點的深色虛線可以幫助我們觀察什麼？', answer: '點相對於原點的方向與距離變化', choices: ['點相對於原點的方向與距離變化', '座標軸的顏色', '題目的數量', '按鈕的大小'] }
    ];

    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function randomPoint() { return { x: randInt(-5, 9), y: randInt(-5, 9) }; }
    function rotatePoint(p, angle, spin) {
      const signed = spin === 'cw' ? -angle : angle;
      const deg = ((signed % 360) + 360) % 360;
      if (deg === 90) return { x: -p.y, y: p.x };
      if (deg === 180) return { x: -p.x, y: -p.y };
      return { x: p.y, y: -p.x };
    }
    function generateQuestion(type) {
      const p = randomPoint();
      if (type === 'reflection') {
        const axis = Math.random() < 0.5 ? 'x' : 'y';
        const ans = axis === 'x' ? { x: p.x, y: -p.y } : { x: -p.x, y: p.y };
        return { prompt: `P${fmt(p)} 沿 ${axis} 軸反射後，P' 是？`, answer: fmt(ans), choices: uniqueChoices(fmt(ans), [fmt({x:-p.x,y:-p.y}), fmt({x:p.y,y:p.x}), fmt({x:-p.y,y:-p.x}), fmt(axis === 'x' ? {x:-p.x,y:p.y} : {x:p.x,y:-p.y})]) };
      }
      if (type === 'rotation') {
        const angle = [90, 180, 270][randInt(0, 2)];
        const spin = Math.random() < 0.5 ? '逆時針' : '順時針';
        const ans = rotatePoint(p, angle, spin === '順時針' ? 'cw' : 'ccw');
        const wrongs = [rotatePoint(p, angle, spin === '順時針' ? 'ccw' : 'cw'), {x:-p.x,y:p.y}, {x:p.y,y:p.x}, {x:-p.y,y:-p.x}, {x:-ans.x,y:ans.y}];
        return { prompt: `P${fmt(p)} 繞原點${spin}旋轉 ${angle}° 後，P' 是？`, answer: fmt(ans), choices: uniqueChoices(fmt(ans), wrongs.map(fmt)) };
      }
      const dx = randInt(-3, 3), dy = randInt(-3, 3);
      const ans = { x: p.x + dx, y: p.y + dy };
      const xText = dx < 0 ? `左 ${Math.abs(dx)}` : dx > 0 ? `右 ${dx}` : '左右不變';
      const yText = dy < 0 ? `下 ${Math.abs(dy)}` : dy > 0 ? `上 ${dy}` : '上下不變';
      return { prompt: `P${fmt(p)} 平移：${xText}、${yText}，P' 是？`, answer: fmt(ans), choices: uniqueChoices(fmt(ans), [fmt({x:p.x-dx,y:p.y+dy}), fmt({x:p.x+dy,y:p.y+dx}), fmt({x:p.x+dx,y:p.y-dy}), fmt({x:-ans.x,y:ans.y})]) };
    }

    function renderQuestions(container, questions) {
      const el = $(container); el.innerHTML = '';
      questions.forEach((q, i) => el.appendChild(qCard(q, i)));
    }
    function appendPractice(type, count = 2) {
      const el = $('quizQuestions');
      for (let i = 0; i < count; i++) el.appendChild(qCard(generateQuestion(type), el.children.length));
    }

    document.querySelectorAll('.nav-btn').forEach(btn => btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      btn.classList.add('active'); $(btn.dataset.view).classList.add('active');
      if (btn.dataset.view === 'mainView') setTimeout(resizeCanvas, 50);
    }));
    document.querySelectorAll('[data-practice]').forEach(b => b.addEventListener('click', () => appendPractice(b.dataset.practice)));

    buildTransformButtons();
    bindControls();
    makePanelDraggable($('predictPanel'));
    makePanelDraggable($('controlPanel'));
    renderQuestions('eurekaQuestions', eureka);
    renderQuestions('quizQuestions', Array.from({ length: 6 }, (_, i) => generateQuestion(['reflection', 'rotation', 'translation'][i % 3])));
    window.addEventListener('resize', resizeCanvas);
    resetTransform();
    resizeCanvas();
  </script>
</body>
</html>
